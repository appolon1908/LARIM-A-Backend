name: secret-scan
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
  pull-requests: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
