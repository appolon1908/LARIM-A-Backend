name: backend-security

on:
  pull_request:
  push:
    branches:
      - main
      - development
      - test
      - staging
      - production
  schedule:
    - cron: "30 7 * * 4"

permissions:
  contents: read

concurrency:
  group: backend-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install the project security toolchain
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-input --upgrade pip
          python -m pip install --disable-pip-version-check --no-input -e ".[dev]"

      - name: Audit installed project dependencies
        run: |
          set -Eeuo pipefail
          python -m pip_audit --local --progress-spinner off

      - name: Run API compatibility security regressions
        run: |
          set -Eeuo pipefail
          test -f tests/test_api_v1_compatibility.py
          python -m pytest -q tests/test_api_v1_compatibility.py

      - name: Validate generated diff state
        run: |
          set -Eeuo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
