name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: larimia
          POSTGRES_USER: larimia
          POSTGRES_PASSWORD: larimia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U larimia -d larimia"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 30

    env:
      PYTHONHASHSEED: "0"
      LARIMIA_ENV: test
      LARIMIA_AUTH_MODE: demo
      LARIMIA_DATABASE_URL: postgresql+psycopg://larimia:larimia@localhost:5432/larimia
      LARIMIA_REDIS_URL: redis://localhost:6379/0
      LARIMIA_WEBSOCKET_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check src tests scripts
      - name: Verify single migration head
        run: |
          set -euo pipefail
          test "$(alembic heads | awk '{print $1}')" = "0005"
      - run: alembic upgrade head
      - run: alembic current
      - run: pytest -q
      - run: python scripts/validate_openapi.py
      - run: python scripts/export_openapi.py
      - name: Verify migration round trip
        run: |
          set -euo pipefail
          alembic downgrade 0002
          alembic upgrade head
      - run: python -m compileall -q src scripts
      - run: docker build --pull --tag larimia-backend:ci .
