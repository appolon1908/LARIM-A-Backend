apiVersion: batch/v1
kind: Job
metadata:
  name: larimia-migrate
  labels:
    app.kubernetes.io/name: larimia-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: larimia-migrate
        app.kubernetes.io/part-of: larimia
    spec:
      restartPolicy: Never
      serviceAccountName: larimia
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/appolon1908-hue/larimia-backend@sha256:REPLACE_WITH_RELEASE_DIGEST
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: larimia-runtime
            - secretRef:
                name: larimia-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
