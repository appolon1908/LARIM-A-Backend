apiVersion: apps/v1
kind: Deployment
metadata:
  name: larimia-worker
  labels:
    app.kubernetes.io/name: larimia-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: larimia-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: larimia-worker
        app.kubernetes.io/part-of: larimia
    spec:
      serviceAccountName: larimia
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/appolon1908-hue/larimia-backend@sha256:REPLACE_WITH_RELEASE_DIGEST
          command:
            - celery
            - -A
            - larimia.worker.celery_app
            - worker
            - --loglevel=INFO
          envFrom:
            - configMapRef:
                name: larimia-runtime
            - secretRef:
                name: larimia-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
