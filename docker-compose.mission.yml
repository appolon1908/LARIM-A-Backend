name: larimia-mission
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: larimia
      POSTGRES_USER: larimia
      POSTGRES_PASSWORD: ${LARIMIA_DB_PASSWORD:?Run scripts/local-env.py first}
    volumes: [mission_pg:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U larimia -d larimia']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  mission_pg:
