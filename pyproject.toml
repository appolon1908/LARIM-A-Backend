[project]
name = "larimia-backend"
version = "0.2.1"
description = "Production-oriented LARIMÍA marketplace backend"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.52,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "redis>=6,<7",
  "celery>=5.6,<5.7",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "structlog>=25,<26",
  "prometheus-client>=0.22,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1",
  "websockets>=15,<16",
  "orjson>=3.11,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "coverage>=7.10,<8"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/larimia"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

# The branch still contains legacy compact formatting. Keep CI focused on
# correctness/undefined-name failures while the formatter cleanup is done in
# reviewable slices instead of hiding functional failures behind hundreds of
# style-only diagnostics.
[tool.ruff.lint]
select = ["E9", "F"]
